<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Twins</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Nunito", Arial, sans-serif;
      background: #eef7d5;
      color: #103f52;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: #087f95;
      color: white;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(20, 63, 74, 0.16);
      transition: transform 0.16s ease, background 0.16s ease;
    }

    button:hover {
      background: #12aaa9;
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .app {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 18%, rgba(245, 197, 66, 0.22), transparent 22%),
        radial-gradient(circle at 86% 80%, rgba(18, 170, 169, 0.22), transparent 24%),
        linear-gradient(135deg, #eef7d5 0%, #d8f5ea 52%, #e7f1ff 100%);
    }

    .setup-panel {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(8, 78, 99, 0.26);
      backdrop-filter: blur(5px);
    }

    .app.setup-visible .setup-panel {
      display: grid;
    }

    .setup-card {
      width: min(720px, 100%);
      max-height: calc(100vh - 44px);
      overflow: auto;
      padding: 24px;
      border: 4px solid rgba(18, 170, 169, 0.46);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 22px 70px rgba(20, 63, 74, 0.26);
    }

    .app.playing .setup-panel,
    .app.player-mode .setup-panel {
      display: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .brand-logo {
      width: 84px;
      height: 84px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .mini-brain {
      width: 46px;
      height: 38px;
      position: relative;
      flex: 0 0 auto;
      border: 4px solid #087f95;
      border-radius: 22px 22px 18px 18px;
      background: #ffd96a;
    }

    .mini-brain::before,
    .mini-brain::after {
      content: "";
      position: absolute;
      top: -8px;
      width: 24px;
      height: 24px;
      border: 4px solid #087f95;
      border-bottom: 0;
      border-radius: 50% 50% 0 0;
      background: #ffd96a;
    }

    .mini-brain::before {
      left: 2px;
    }

    .mini-brain::after {
      right: 2px;
    }

    h1 {
      margin: 0;
      color: #087f95;
      font-size: 34px;
      line-height: 1;
    }

    .setup-title {
      margin: 22px 0 10px;
      color: #087f95;
      font-size: 18px;
      font-weight: 900;
    }

    .sound-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
      gap: 10px;
    }

    .sound-option {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 10px 12px;
      border: 3px solid rgba(18, 170, 169, 0.38);
      border-radius: 10px;
      background: #ffffff;
      color: #103f52;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .sound-option input {
      width: 22px;
      height: 22px;
      accent-color: #087f95;
    }

    .setting-row {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
      font-weight: 900;
    }

    .setting-row input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 3px solid rgba(18, 170, 169, 0.5);
      border-radius: 10px;
      color: #103f52;
      font-weight: 900;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      font-size: 16px;
      font-weight: 900;
    }

    .toggle-row input {
      width: 22px;
      height: 22px;
      accent-color: #087f95;
    }

    .setup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .share-box {
      display: none;
      gap: 8px;
      margin-top: 12px;
    }

    .share-box.show {
      display: grid;
    }

    .share-box input {
      width: 100%;
      padding: 10px 12px;
      border: 3px solid rgba(18, 170, 169, 0.5);
      border-radius: 10px;
      color: #103f52;
      font-size: 14px;
      font-weight: 800;
    }

    .share-note {
      min-height: 20px;
      color: #087f95;
      font-size: 14px;
      font-weight: 900;
    }

    .live-panel {
      display: none;
      gap: 12px;
      margin-top: 12px;
      padding: 12px;
      border: 3px solid rgba(8, 127, 149, 0.18);
      border-radius: 12px;
      background: rgba(232, 252, 248, 0.86);
    }

    .live-panel.show {
      display: grid;
    }

    .live-status {
      color: #103f52;
      font-weight: 900;
      line-height: 1.35;
    }

    .live-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .live-field {
      min-height: 58px;
      padding: 8px 10px;
      border: 2px solid rgba(18, 170, 169, 0.22);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.82);
    }

    .live-field span {
      display: block;
      margin-bottom: 4px;
      color: #087f95;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .live-field strong {
      display: block;
      color: #103f52;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.15;
    }

    .live-settings {
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.62);
      color: #103f52;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .live-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      place-items: center;
      min-height: 45px;
      padding: 10px 16px;
      border-radius: 10px;
      background: #ffffff;
      color: #087f95;
      text-decoration: none;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(20, 63, 74, 0.12);
    }

    .game-area {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      padding: 18px;
    }

    .status-bar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto auto;
      align-items: center;
      gap: 10px;
    }

    .power-station {
      display: grid;
      grid-template-columns: 62px 92px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border: 3px solid rgba(8, 127, 149, 0.2);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 8px 22px rgba(20, 63, 74, 0.08);
    }

    .corner-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      opacity: 0.9;
    }

    .brain {
      --brain-glow: rgba(245, 197, 66, 0.16);
      width: 92px;
      height: 78px;
      position: relative;
      display: grid;
      place-items: center;
      border: 4px solid rgba(8, 127, 149, 0.82);
      border-radius: 42% 48% 38% 44% / 48% 48% 36% 38%;
      background:
        radial-gradient(circle at 26% 28%, rgba(255, 255, 255, 0.82) 0 10px, transparent 11px),
        radial-gradient(circle at 72% 26%, rgba(255, 255, 255, 0.64) 0 8px, transparent 9px),
        linear-gradient(135deg, #f9efd0 0%, #bdeee7 42%, #11a8a7 100%);
      box-shadow:
        inset 0 0 0 4px rgba(255, 255, 255, 0.42),
        0 0 0 8px var(--brain-glow),
        0 8px 18px rgba(20, 63, 74, 0.14);
      transform: rotate(-2deg);
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.25s ease;
      overflow: visible;
      animation: brainIdle 4.6s ease-in-out infinite;
    }

    .brain::before,
    .brain::after {
      content: "";
      position: absolute;
      border: 3px solid rgba(8, 127, 149, 0.55);
      border-left: 0;
      border-bottom: 0;
      border-radius: 50%;
      opacity: 0.66;
      pointer-events: none;
    }

    .brain::before {
      width: 48px;
      height: 30px;
      left: 14px;
      top: 15px;
      transform: rotate(12deg);
    }

    .brain::after {
      width: 38px;
      height: 28px;
      right: 12px;
      bottom: 15px;
      transform: rotate(-158deg);
    }

    .brain-face {
      width: 42px;
      height: 24px;
      position: relative;
      z-index: 2;
    }

    .brain-face::before,
    .brain-face::after {
      content: "";
      position: absolute;
      top: 4px;
      width: 7px;
      height: 9px;
      border-radius: 50%;
      background: #103f52;
      box-shadow: inset 2px 1px 0 rgba(255, 255, 255, 0.55);
    }

    .brain-face::before {
      left: 8px;
    }

    .brain-face::after {
      right: 8px;
    }

    .brain-smile {
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 18px;
      height: 8px;
      border-bottom: 3px solid #103f52;
      border-radius: 0 0 18px 18px;
      transform: translateX(-50%);
    }

    .brain-spark {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f5c542;
      opacity: 0;
      transform: scale(0.5);
      box-shadow: 0 0 10px rgba(245, 197, 66, 0.74);
    }

    .brain-spark.one {
      right: -5px;
      top: 5px;
    }

    .brain-spark.two {
      left: 1px;
      bottom: 4px;
    }

    .brain-spark.three {
      right: 13px;
      bottom: -7px;
    }

    .brain.power-mid {
      --brain-glow: rgba(18, 170, 169, 0.24);
      filter: saturate(1.08);
    }

    .brain.power-full {
      --brain-glow: rgba(245, 197, 66, 0.34);
      filter: saturate(1.18) drop-shadow(0 0 10px rgba(245, 197, 66, 0.48));
    }

    .brain.power-mid .brain-spark.one,
    .brain.power-full .brain-spark {
      opacity: 1;
      transform: scale(1);
      animation: sparkTwinkle 1.4s ease-in-out infinite;
    }

    .brain.power-full .brain-spark.two {
      animation-delay: 0.2s;
    }

    .brain.power-full .brain-spark.three {
      animation-delay: 0.42s;
    }

    .brain.boost {
      animation: brainBoost 0.34s ease both;
      filter: saturate(1.18) drop-shadow(0 0 14px rgba(245, 197, 66, 0.82));
    }

    .power-info {
      display: grid;
      gap: 8px;
    }

    .round-line {
      color: #087f95;
      font-size: 18px;
      font-weight: 900;
    }

    .power-track {
      height: 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 0 8px;
      border: 3px solid #087f95;
      border-radius: 999px;
      background:
        linear-gradient(90deg, transparent 8px, rgba(8, 127, 149, 0.22) 8px calc(100% - 8px), transparent calc(100% - 8px)),
        #ffffff;
      overflow: hidden;
    }

    .power-fill {
      position: absolute;
      left: 8px;
      right: auto;
      top: 50%;
      width: 0%;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, #d8c75a, #52c98c, #12aaa9);
      transform: translateY(-50%);
      transition: width 0.35s ease;
      z-index: 1;
    }

    .neuron-node {
      width: 12px;
      height: 12px;
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      border: 3px solid rgba(8, 127, 149, 0.58);
      border-radius: 50%;
      background: #ffffff;
      transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    }

    .neuron-node.active {
      border-color: #087f95;
      background: #f5c542;
      box-shadow: 0 0 0 5px rgba(245, 197, 66, 0.18), 0 0 12px rgba(18, 170, 169, 0.42);
      transform: scale(1.08);
    }

    .timer {
      min-width: 112px;
      padding: 12px 14px;
      border: 3px solid rgba(245, 197, 66, 0.72);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.76);
      color: #087f95;
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 8px 22px rgba(20, 63, 74, 0.08);
    }

    .quiet-button {
      min-height: 48px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.84);
      color: #087f95;
      box-shadow: 0 6px 16px rgba(20, 63, 74, 0.1);
    }

    .quiet-button.active {
      background: #f5c542;
      color: #103f52;
    }

    .player-mode .teacher-only {
      display: none;
    }

    .app.player-mode ~ .completion .teacher-only {
      display: none;
    }

    .live-player-mode ~ .completion #playAgainBtn {
      display: none;
    }

    .board {
      display: grid;
      grid-template-rows: minmax(360px, 1fr);
      gap: 0;
      min-height: 0;
    }

    .feedback {
      position: fixed;
      left: 50%;
      top: 120px;
      z-index: 30;
      min-height: 58px;
      display: grid;
      place-items: center;
      padding: 10px 24px;
      border: 4px solid rgba(245, 197, 66, 0.7);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.96);
      color: #087f95;
      text-align: center;
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 900;
      box-shadow: 0 16px 34px rgba(20, 63, 74, 0.18);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .feedback.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .feedback.celebrate {
      animation: matchCelebrate 0.78s ease both;
    }

    .word-grid {
      min-height: calc(100vh - 148px);
      position: relative;
      transition: opacity 0.45s ease;
    }

    .word-grid.fading-out {
      opacity: 0;
    }

    .word-card {
      width: clamp(138px, 17vw, 220px);
      min-height: clamp(112px, 15vw, 172px);
      position: absolute;
      left: var(--x);
      top: var(--y);
      display: grid;
      place-items: center;
      padding: 14px;
      border: 4px solid #12aaa9;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.95);
      color: #103f52;
      text-align: center;
      font-size: clamp(24px, 4vw, 50px);
      font-weight: 900;
      overflow-wrap: anywhere;
      word-break: normal;
      line-height: 1.02;
      box-shadow: 0 14px 26px rgba(20, 63, 74, 0.14);
      cursor: pointer;
      user-select: none;
      transform: rotate(var(--rotation));
      animation: cardRock 5.2s ease-in-out infinite;
      animation-delay: var(--delay);
      opacity: 1;
      transition: border-color 0.16s ease, background 0.16s ease, opacity 0.48s ease, box-shadow 0.16s ease;
    }

    .word-card.entering {
      opacity: 0;
    }

    .word-card:hover:not(.matched) {
      border-color: #f5c542;
      box-shadow: 0 0 0 7px rgba(245, 197, 66, 0.2), 0 14px 26px rgba(20, 63, 74, 0.14);
    }

    .word-card.selected {
      border-color: #f5c542;
      background: #fff6d7;
      box-shadow: 0 0 0 7px rgba(245, 197, 66, 0.22), 0 10px 24px rgba(20, 63, 74, 0.15);
    }

    .word-card.matched {
      border-color: #52c98c;
      background: #e8ffe9;
      color: #277345;
      cursor: default;
      opacity: 0.58;
    }

    .word-card.just-matched {
      animation: matchCardPop 0.68s ease both;
    }

    .word-card.wrong {
      border-color: #e15b64;
      animation: shake 0.36s ease;
    }

    .teacher-live-mode .word-card {
      cursor: pointer;
    }

    .teacher-live-mode .word-grid.laser-armed {
      cursor: crosshair;
    }

    .word-card.remote-highlight {
      border-color: #f5c542;
      background: #fff8d9;
      box-shadow: 0 0 0 10px rgba(245, 197, 66, 0.26), 0 14px 30px rgba(20, 63, 74, 0.18);
      animation: spotlightPulse 1.05s ease both;
    }

    .laser-dot {
      position: absolute;
      left: var(--laser-x);
      top: var(--laser-y);
      z-index: 8;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e9323e;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 5px rgba(233, 50, 62, 0.16), 0 0 18px rgba(233, 50, 62, 0.38);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .laser-dot.show {
      opacity: 1;
      animation: laserHold 1.35s ease-in-out infinite;
    }

    .found-pairs {
      display: none;
    }

    .pair-chip,
    .odd-chip {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #087f95;
      color: white;
      font-size: 17px;
      font-weight: 900;
    }

    .odd-chip {
      background: #835f0e;
    }

    .completion {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(12, 48, 58, 0.48);
      z-index: 20;
    }

    .ready-overlay,
    .countdown-overlay {
      position: fixed;
      inset: 0;
      z-index: 18;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(238, 247, 213, 0.72);
      backdrop-filter: blur(4px);
    }

    .ready-overlay.show,
    .countdown-overlay.show {
      display: flex;
    }

    .ready-panel {
      width: min(430px, 100%);
      padding: 28px;
      border: 4px solid rgba(18, 170, 169, 0.44);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      text-align: center;
      box-shadow: 0 18px 60px rgba(20, 63, 74, 0.22);
    }

    .ready-panel h2 {
      margin: 0 0 10px;
      color: #087f95;
      font-size: 34px;
    }

    .ready-panel p {
      margin: 0 0 20px;
      color: #103f52;
      font-size: 19px;
      font-weight: 800;
    }

    .countdown-number {
      min-width: 180px;
      min-height: 180px;
      display: grid;
      place-items: center;
      border: 5px solid rgba(245, 197, 66, 0.8);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      color: #087f95;
      font-size: clamp(56px, 12vw, 110px);
      font-weight: 900;
      box-shadow: 0 18px 60px rgba(20, 63, 74, 0.18);
      animation: countdownPop 0.72s ease both;
    }

    .completion.show {
      display: flex;
    }

    .completion-panel {
      width: min(430px, 100%);
      padding: 28px;
      border-radius: 16px;
      text-align: center;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(20, 63, 74, 0.3);
    }

    .completion-panel h2 {
      margin: 0 0 10px;
      color: #087f95;
      font-size: 34px;
    }

    .completion-panel p {
      margin: 0 0 22px;
      color: #087f95;
      font-size: 19px;
      font-weight: 800;
    }

    .completion-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    @keyframes brainIdle {
      0%, 100% {
        transform: rotate(-2deg) translateY(0);
      }
      50% {
        transform: rotate(1deg) translateY(-2px);
      }
    }

    @keyframes brainBoost {
      0%, 100% {
        transform: rotate(-2deg) scale(1);
      }
      45% {
        transform: rotate(-5deg) scale(1.12);
      }
    }

    @keyframes sparkTwinkle {
      0%, 100% {
        opacity: 0.68;
        transform: scale(0.82);
      }
      50% {
        opacity: 1;
        transform: scale(1.12);
      }
    }

    @keyframes cardRock {
      0%, 100% {
        transform: rotate(var(--rotation)) translateY(0);
      }
      50% {
        transform: rotate(calc(var(--rotation) * -0.35)) translateY(-5px);
      }
    }

    @keyframes matchCelebrate {
      0% {
        opacity: 0;
        transform: translate(-50%, 12px) scale(0.88);
      }
      28% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1.12);
        box-shadow: 0 0 0 12px rgba(245, 197, 66, 0.24), 0 16px 34px rgba(20, 63, 74, 0.18);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    @keyframes matchCardPop {
      0% {
        transform: rotate(var(--rotation)) scale(1);
      }
      42% {
        transform: rotate(var(--rotation)) scale(1.08);
        box-shadow: 0 0 0 9px rgba(82, 201, 140, 0.24), 0 16px 30px rgba(20, 63, 74, 0.16);
      }
      100% {

    let currentPointerKey = "";
    let highlightTimer = null;
    let feedbackTimer = null;
    let currentMatchKey = "";
    let latestMatch = null;
    let laserActive = false;
    let pendingPlayerStart = false;
    let usedTargetWords = new Set();
    let usedPatternCounts = new Map();
    const cardLayouts = {
      3: [

    function renderSoundOptions() {
      soundOptions.innerHTML = soundFamilies.map(sound => `
        <label class="sound-option">
          <input type="checkbox" value="${sound.id}" ${sound.defaultSelected ? "checked" : ""}>
          ${sound.label}
        </label>
      `).join("");
    }

    function applySettingsToControls(config) {
      const soundIds = new Set(config.sounds || []);
      if (soundIds.size > 0) {
        soundOptions.querySelectorAll("input").forEach(input => {
          input.checked = soundIds.has(input.value);
        });
      }

      if (config.rounds) roundInput.value = config.rounds;
      timerToggle.checked = Boolean(config.timer);
      timerInput.disabled = !timerToggle.checked;
      if (config.seconds) timerInput.value = config.seconds;
      labelToggle.checked = config.labels !== false;
    }

    function getSettingsFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const sounds = (params.get("sounds") || "")
        .split(",")
        .map(sound => sound.trim())
        .filter(Boolean);

      if (!sounds.length) return null;

      return {
        sounds,
        rounds: clampNumber(params.get("rounds"), 2, 20, 6),
        timer: params.get("timer") === "1",
        seconds: clampNumber(params.get("seconds"), 30, 300, 120),
        labels: params.get("labels") !== "0",
        player: params.get("player") === "1",
        room: params.get("room") || ""
      };
    }

    function buildPlayerUrl() {
      if (!readSettings()) return "";

      const params = new URLSearchParams();
      params.set("player", "1");
      params.set("sounds", selectedSounds.map(sound => sound.id).join(","));
      params.set("rounds", settings.totalRounds);
      params.set("timer", settings.timerEnabled ? "1" : "0");
      params.set("seconds", settings.timerSeconds);
      params.set("labels", settings.showLabels ? "1" : "0");

      return `${window.location.origin}${window.location.pathname}?${params.toString()}`;
    }

    async function createPlayerLink() {
      const url = buildPlayerUrl();
      if (!url) {
        feedback.textContent = "Choose at least one sound family.";
        feedback.classList.add("show");
        return;
      }

      shareLink.value = url;
      shareBox.classList.add("show");
      shareLink.select();

      try {
        await navigator.clipboard.writeText(url);
        shareNote.textContent = "Player link copied.";
      } catch (error) {
        shareNote.textContent = "Player link ready.";
      }
    }

    function buildRoomId() {
      return Math.random().toString(36).slice(2, 6).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
    }

    function roomPath(id = roomId) {
      return database.ref(`rooms/${id}`);
    }

    function getCurrentSettingsPayload() {
      if (!readSettings()) return null;

      return {
        sounds: selectedSounds.map(sound => sound.id),
        rounds: settings.totalRounds,
        timer: settings.timerEnabled,
        seconds: settings.timerSeconds,
        labels: settings.showLabels
      };
    }

    async function createLiveRoom() {
      const payload = getCurrentSettingsPayload();
      if (!payload) {
        feedback.textContent = "Choose at least one sound family.";
        feedback.classList.add("show");
        return;
      }

      liveMode = true;
      liveRole = "teacher";
      roomId = buildRoomId();
      roomRef = roomPath(roomId);
      await roomRef.set({
        state: "waiting",
        settings: payload,
        player: {
          joined: false,
          ready: false,
          status: "waiting"
        },
        progress: {
          round: 0,
          pairsFound: 0,
          totalPairs: payload.rounds * (payload.sounds.length === 1 ? 1 : 2),
          finished: false,
          cards: []
        },
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });

      const params = new URLSearchParams();
      params.set("player", "1");
      params.set("room", roomId);
      params.set("sounds", payload.sounds.join(","));
      params.set("rounds", payload.rounds);
      params.set("timer", payload.timer ? "1" : "0");
      params.set("seconds", payload.seconds);
      params.set("labels", payload.labels ? "1" : "0");

      shareLink.value = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
      shareBox.classList.add("show");
      livePanel.classList.add("show");
      subscribeToRoom(roomId);

      try {
        await navigator.clipboard.writeText(shareLink.value);
        shareNote.textContent = `Live room ${roomId} copied.`;
      } catch (error) {
        shareNote.textContent = `Live room ${roomId} ready.`;
      }
    }

    function subscribeToRoom(id) {
      if (roomRef && roomListener) {
        roomRef.off("value", roomListener);
      }

      roomRef = roomPath(id);
      roomListener = snapshot => handleRoomUpdate(snapshot.val());
      roomRef.on("value", roomListener);
    }

    function handleRoomUpdate(room) {
      if (!room) return;

      if (liveRole === "teacher") {
        renderTeacherRoom(room);
      } else {
        handlePlayerRoom(room);
      }
    }

    function renderTeacherRoom(room) {
      livePanel.classList.add("show");
      const playerStatus = room.player?.joined ? room.player.status || "joined" : "not joined";
      const progress = room.progress || {};
      const settingsInfo = room.settings || {};
      liveStatus.textContent = room.state === "finished"
        ? "Student finished. Adjust settings or reset the room."
        : "Live room controls";
      liveRoomCode.textContent = roomId || "-";
      livePlayerState.textContent = formatRoomState(playerStatus);
      liveProgress.textContent = `${progress.pairsFound || 0}/${progress.totalPairs || 0} pairs`;
      liveRoomState.textContent = formatRoomState(room.state || "waiting");
      liveSettings.textContent = `Sounds: ${getSoundLabels(settingsInfo.sounds)} | Rounds: ${settingsInfo.rounds || "-"} | Timer: ${settingsInfo.timer ? `${settingsInfo.seconds}s` : "Off"} | Celebration: ${settingsInfo.labels === false ? "Off" : "On"}`;

      if (room.state === "playing" || room.state === "finished") {
        app.classList.add("playing");
        app.classList.add("teacher-live-mode");
        app.classList.remove("player-mode", "live-player-mode");
        roundLine.textContent = room.state === "finished" ? "Finished" : `Round ${progress.round || 1} of ${room.settings?.rounds || settings.totalRounds}`;
        const totalPairs = progress.totalPairs || 1;
        const powerProgress = Math.min(100, Math.round(((progress.pairsFound || 0) / totalPairs) * 100));
        powerFill.style.width = `${powerProgress}%`;
        updatePowerVisuals(powerProgress);
        renderObserverCards(progress.cards || []);
        applyCardHighlight(room.highlight || null);
        applyPointer(room.pointer || null);
        applyLiveFeedback(progress.lastMatch || null);
      }

      if (room.state === "finished") {
        app.classList.remove("playing", "teacher-live-mode");
        app.classList.add("setup-visible");
        clearWordCards();
      }
    }

    function getSoundLabels(soundIds = []) {
      const labels = soundIds
        .map(id => soundFamilies.find(sound => sound.id === id)?.label)
        .filter(Boolean);
      return labels.length ? labels.join(", ") : "None";
    }

    function formatRoomState(state = "waiting") {
      return state.charAt(0).toUpperCase() + state.slice(1);
    }

    function renderObserverCards(cards) {
      clearWordCards();
      foundPairs.innerHTML = "";
      if (!cards.length) return;

      const layout = getRoundLayout(cards.length);
      cards.forEach((card, index) => {
        const cardSlot = card.view || layout[index];
        const button = document.createElement("button");
        button.className = `word-card${card.matched ? " matched" : ""}`;
        button.type = "button";
        button.disabled = liveRole !== "teacher";
        button.textContent = card.word;
        button.dataset.id = card.id;
        button.style.setProperty("--x", cardSlot.x);
        button.style.setProperty("--y", cardSlot.y);
        button.style.setProperty("--rotation", `${cardSlot.rotation}deg`);
        button.style.setProperty("--delay", `${-0.4 - (index * 0.8)}s`);
        if (liveRole === "teacher") {
          button.addEventListener("click", event => {
            if (laserActive) return;
            event.stopPropagation();
            spotlightCard(card.id);
          });
        }
        wordGrid.appendChild(button);
        fitWordToCard(button);
      });
    }

    function clearWordCards() {
      wordGrid.querySelectorAll(".word-card").forEach(card => card.remove());
    }

    function handlePlayerRoom(room) {
      if (room.settings) {
        applySettingsToControls(room.settings);
      }

      if (room.state === "waiting" || room.state === "finished") {
        liveCountdownStarted = false;
        if (room.state === "waiting" && !room.player?.joined) {
          roomRef.update({
            "player/joined": true,
            updatedAt: firebase.database.ServerValue.TIMESTAMP
          });
        }
        showPlayerReady(
          room.state === "finished"
            ? "Finished. Waiting for teacher."
            : (room.player?.ready ? "Ready. Waiting for teacher." : "Press ready to start."),
          room.state === "finished" || Boolean(room.player?.ready)
        );
      }

      if (room.state === "countdown" && !liveCountdownStarted) {
        liveCountdownStarted = true;
        startPlayerCountdown();
      }

      applyCardHighlight(room.highlight || null);
      applyPointer(room.pointer || null);
    }

    function applyLiveFeedback(match) {
      if (!match || !match.label) return;

      const matchKey = `${match.label}:${match.firstWord}:${match.secondWord}:${match.updatedAt || ""}`;
      if (matchKey === currentMatchKey) return;
      currentMatchKey = matchKey;
      showSoundLabel(match.label);
    }

    async function spotlightCard(cardId) {
      if (!liveMode || liveRole !== "teacher" || !roomRef) return;

      await roomRef.update({
        highlight: {
          cardId,
          updatedAt: firebase.database.ServerValue.TIMESTAMP
        },
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
    }

    async function sendLaserPoint(event) {
      if (!liveMode || liveRole !== "teacher" || !roomRef || !laserActive) return;

      const rect = wordGrid.getBoundingClientRect();
      const x = Math.max(0, Math.min(100, ((event.clientX - rect.left) / rect.width) * 100));
      const y = Math.max(0, Math.min(100, ((event.clientY - rect.top) / rect.height) * 100));
      await roomRef.update({
        pointer: {
          x: Number(x.toFixed(2)),
          y: Number(y.toFixed(2)),
          updatedAt: firebase.database.ServerValue.TIMESTAMP
        },
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
    }

    function applyPointer(pointer) {
      const pointerKey = pointer ? `${pointer.x}-${pointer.y}-${pointer.updatedAt || ""}` : "";
      if (pointerKey === currentPointerKey) return;

      currentPointerKey = pointerKey;
      laserDot.classList.remove("show");

      if (!pointer) return;

      laserDot.style.setProperty("--laser-x", `${pointer.x}%`);
      laserDot.style.setProperty("--laser-y", `${pointer.y}%`);
      void laserDot.offsetWidth;
      laserDot.classList.add("show");
    }

    async function toggleLaserMode() {
      if (!liveMode || liveRole !== "teacher") return;

      laserActive = !laserActive;
      laserBtn.classList.toggle("active", laserActive);
      wordGrid.classList.toggle("laser-armed", laserActive);
      if (!laserActive && roomRef) {
        await roomRef.update({
          pointer: null,
          updatedAt: firebase.database.ServerValue.TIMESTAMP
        });
      }
    }

    function applyCardHighlight(highlight) {
      const cardId = highlight?.cardId || "";
      const highlightKey = cardId ? `${cardId}-${highlight?.updatedAt || ""}` : "";
      if (highlightKey === currentHighlightKey) return;

      currentHighlightKey = highlightKey;
      wordGrid.querySelectorAll(".word-card.remote-highlight").forEach(card => {
        card.classList.remove("remote-highlight");
      });

      if (highlightTimer) {
        clearTimeout(highlightTimer);
        highlightTimer = null;
      }

      if (!cardId) return;

      const card = wordGrid.querySelector(`[data-id="${CSS.escape(cardId)}"]`);
      if (!card) return;

      card.classList.add("remote-highlight");
      highlightTimer = setTimeout(() => {
        card.classList.remove("remote-highlight");
        currentHighlightKey = "";
      }, 1600);
    }

    async function startLiveRoom() {
      if (!roomRef) return;
      await roomRef.update({
        state: "countdown",
        "player/status": "starting",
        "progress/round": 0,
        "progress/pairsFound": 0,
        "progress/finished": false,
        "progress/cards": [],
        highlight: null,
        pointer: null,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
    }

    async function resetLiveRoom() {
      if (!roomRef) return;
      const payload = getCurrentSettingsPayload();
      if (!payload) return;

      await roomRef.update({
        state: "waiting",
        settings: payload,
        player: {
          joined: false,
          ready: false,
          status: "waiting"
        },
        progress: {
          round: 0,
          pairsFound: 0,
          totalPairs: payload.rounds * (payload.sounds.length === 1 ? 1 : 2),
          finished: false,
          cards: []
        },
        highlight: null,
        pointer: null,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
      app.classList.remove("playing");
      app.classList.remove("teacher-live-mode");
      clearWordCards();
      roundLine.textContent = "Ready";
      powerFill.style.width = "0%";
      updatePowerVisuals(0);
    }

    async function joinLiveRoom(id) {
      liveMode = true;
      liveRole = "player";
      playerMode = true;
      roomId = id;
      currentHighlightKey = "";
      currentPointerKey = "";
      app.classList.add("player-mode", "live-player-mode");
      subscribeToRoom(id);
      await roomPath(id).update({
        "player/joined": true,
        "player/status": "joined",
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
    }

    function shuffleArray(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function clampNumber(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, Math.round(number)));
    }

    function getChosenSounds() {
      const chosenIds = [...soundOptions.querySelectorAll("input:checked")].map(input => input.value);
      return soundFamilies.filter(sound => chosenIds.includes(sound.id));
    }

    function readSettings() {
      selectedSounds = getChosenSounds();
      settings = {
        totalRounds: clampNumber(roundInput.value, 2, 20, 6),
        timerEnabled: timerToggle.checked,
        timerSeconds: clampNumber(timerInput.value, 30, 300, 120),
        showLabels: labelToggle.checked
      };
      roundInput.value = settings.totalRounds;
      timerInput.value = settings.timerSeconds;
      return selectedSounds.length > 0;
    }

    function resetSoundQueue() {
      soundQueue = shuffleArray(selectedSounds.map(sound => sound.id));
    }

    function takeSound(excludedIds = []) {
      if (soundQueue.length === 0 || soundQueue.every(id => excludedIds.includes(id))) {
        resetSoundQueue();
      }

      const index = soundQueue.findIndex(id => !excludedIds.includes(id));
      const soundId = index >= 0 ? soundQueue.splice(index, 1)[0] : selectedSounds[0].id;
      return selectedSounds.find(sound => sound.id === soundId);
    }

    function choosePair(sound) {
      const unusedWords = sound.words.filter(item => !usedTargetWords.has(normalizeWord(item.word)));
      const firstPool = unusedWords.length > 0 ? unusedWords : sound.words;
      const first = chooseBalancedWord(sound, firstPool);
      const secondPools = [
        unusedWords.filter(item => item.word !== first.word && item.spelling !== first.spelling),
        unusedWords.filter(item => item.word !== first.word),
        sound.words.filter(item => item.word !== first.word && item.spelling !== first.spelling),
        sound.words.filter(item => item.word !== first.word)
      ];
      const secondPool = secondPools.find(pool => pool.length > 0) || [];
      const second = chooseBalancedWord(sound, secondPool);
      usedTargetWords.add(normalizeWord(first.word));
      usedTargetWords.add(normalizeWord(second.word));
      markPatternUsed(sound, first);
      markPatternUsed(sound, second);
      return [
        { ...first, soundId: sound.id, soundLabel: sound.label },
        { ...second, soundId: sound.id, soundLabel: sound.label }
      ];
    }

    function chooseBalancedWord(sound, words) {
      const shuffled = shuffleArray(words);
      const lowestCount = Math.min(...shuffled.map(item => getPatternCount(sound, item)));
      const balancedPool = shuffled.filter(item => getPatternCount(sound, item) === lowestCount);
      return shuffleArray(balancedPool)[0];
    }

    function getPatternKey(sound, item) {
      return `${sound.id}:${item.spelling}`;
    }

    function getPatternCount(sound, item) {
      return usedPatternCounts.get(getPatternKey(sound, item)) || 0;
    }

    function markPatternUsed(sound, item) {
      const key = getPatternKey(sound, item);
      usedPatternCounts.set(key, (usedPatternCounts.get(key) || 0) + 1);
    }

    function normalizeWord(word) {
      return word.toLowerCase();
    }

    function getDistractorExcludedSoundIds(excludedSoundIds) {
      const ids = new Set([...selectedSounds.map(sound => sound.id), ...excludedSoundIds]);
      if (ids.has("long-u") || ids.has("long-oo")) {
        ids.add("long-u");
        ids.add("long-oo");
      }
      return ids;
    }

    function chooseOddWord(excludedSoundIds) {
      const blockedIds = getDistractorExcludedSoundIds(excludedSoundIds);
      const blockedWords = new Set(soundFamilies
        .filter(sound => blockedIds.has(sound.id))
        .flatMap(sound => sound.words.map(item => item.word.toLowerCase())));
      const unselectedSounds = soundFamilies
        .filter(sound => !blockedIds.has(sound.id))
        .map(sound => ({
          ...sound,
          words: sound.words.filter(item => !blockedWords.has(item.word.toLowerCase()))
        }))
        .filter(sound => sound.words.length > 0);

      if (unselectedSounds.length > 0) {
        const sound = shuffleArray(unselectedSounds)[0];
        const word = shuffleArray(sound.words)[0];
        return { ...word, soundId: sound.id, soundLabel: sound.label, odd: true };
      }

      return { ...shuffleArray(distractorWords)[0], odd: true };
    }

    function buildRound() {
      const pairsNeeded = selectedSounds.length === 1 ? 1 : 2;
      const roundSounds = [];
      for (let i = 0; i < pairsNeeded; i++) {
        roundSounds.push(takeSound(roundSounds.map(sound => sound.id)));
      }

      const pairCards = roundSounds.flatMap(sound => choosePair(sound));
      const oddCard = chooseOddWord(roundSounds.map(sound => sound.id));
      const cards = shuffleArray([...pairCards, oddCard]).map((card, index) => ({
        ...card,
        id: `${roundNumber}-${index}-${card.word}`
      }));

      activeRound = {
        cards,
        foundSoundIds: new Set(),
        targetPairCount: pairsNeeded,
        finished: false
      };
    }

    function renderRound() {
      const cardCount = activeRound.cards.length;
      wordGrid.style.setProperty("--card-count", cardCount);
      wordGrid.classList.toggle("three-card", cardCount === 3);
      clearWordCards();
      foundPairs.innerHTML = "";
      selectedCards = [];
      const layout = getRoundLayout(cardCount);

      activeRound.cards.forEach((card, index) => {
        const cardSlot = layout[index];
        card.view = {
          x: cardSlot.x,
          y: cardSlot.y,
          rotation: cardSlot.rotation
        };
        const button = document.createElement("button");
        button.className = "word-card entering";
        button.type = "button";
        button.textContent = card.word;
        button.dataset.id = card.id;
        button.style.setProperty("--x", cardSlot.x);
        button.style.setProperty("--y", cardSlot.y);
        button.style.setProperty("--rotation", `${cardSlot.rotation}deg`);
        button.style.setProperty("--delay", `${-0.4 - (index * 0.8)}s`);
        button.addEventListener("click", () => selectCard(card.id));
        wordGrid.appendChild(button);
        fitWordToCard(button);
      });

      updateStatus();
      publishProgress();
      requestAnimationFrame(() => {
        wordGrid.querySelectorAll(".word-card.entering").forEach(card => {
          fitWordToCard(card);
          card.classList.remove("entering");
        });
      });
    }

    function fitWordToCard(card) {
      const maxSize = window.matchMedia("(max-width: 720px)").matches ? 38 : 50;
      let size = maxSize;
      card.style.fontSize = `${size}px`;

      while ((card.scrollWidth > card.clientWidth || card.scrollHeight > card.clientHeight) && size > 18) {
        size -= 2;
        card.style.fontSize = `${size}px`;
      }
    }

    function getRoundLayout(cardCount) {
      const preset = shuffleArray(cardLayouts[cardCount])[0];
      return shuffleArray(preset).map(slot => ({
        x: jitterPercent(slot.x, -4, 4, 5, 78),
        y: jitterPercent(slot.y, -5, 5, 8, 62),
        rotation: slot.rotation + randomInt(-3, 3)
      }));
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function jitterPercent(value, minJitter, maxJitter, minValue, maxValue) {
      const number = Number.parseFloat(value);
      const next = Math.min(maxValue, Math.max(minValue, number + randomInt(minJitter, maxJitter)));
      return `${next}%`;
    }

    function updateStatus() {
      if (!selectedSounds.length) {
        roundLine.textContent = "Ready";
        powerFill.style.width = "0%";
        updatePowerVisuals(0);
        return;
      }

      roundLine.textContent = `Round ${Math.min(roundNumber, settings.totalRounds)} of ${settings.totalRounds}`;
      const progress = Math.min(100, Math.round((scorePairs / getTargetPairTotal()) * 100));
      powerFill.style.width = `${progress}%`;
      updatePowerVisuals(progress);
    }

    function updatePowerVisuals(progress) {
      const activeNodes = Math.ceil((progress / 100) * neuronNodes.length);
      neuronNodes.forEach((node, index) => {
        node.classList.toggle("active", index < activeNodes);
      });

      brain.classList.toggle("power-mid", progress >= 34 && progress < 100);
      brain.classList.toggle("power-full", progress >= 100);
    }

    function getTargetPairTotal() {
      const pairsPerRound = selectedSounds.length === 1 ? 1 : 2;
      return settings.totalRounds * pairsPerRound;
    }

    function selectCard(cardId) {
      if (!activeRound || activeRound.finished) return;

      const button = wordGrid.querySelector(`[data-id="${CSS.escape(cardId)}"]`);
      if (!button || button.classList.contains("matched")) return;

      if (selectedCards.includes(cardId)) {
        selectedCards = selectedCards.filter(id => id !== cardId);
        button.classList.remove("selected");
        return;
      }

      selectedCards.push(cardId);
      button.classList.add("selected");

      if (selectedCards.length === 2) {
        checkSelectedPair();
      }
    }

    function checkSelectedPair() {
      const cards = selectedCards.map(id => activeRound.cards.find(card => card.id === id));
      const buttons = selectedCards.map(id => wordGrid.querySelector(`[data-id="${CSS.escape(id)}"]`));
      const [first, second] = cards;
      const isPair = first.soundId === second.soundId && !first.odd && !second.odd && first.word !== second.word;

      if (isPair) {
        buttons.forEach(button => {
          button.classList.remove("selected");
          button.classList.add("matched", "just-matched");
          button.disabled = true;
          setTimeout(() => button.classList.remove("just-matched"), 720);
        });
        activeRound.foundSoundIds.add(first.soundId);
        scorePairs += 1;
        cards.forEach(card => {
          card.matched = true;
        });
        latestMatch = {
          label: first.soundLabel,
          firstWord: first.word,
          secondWord: second.word,
          updatedAt: Date.now()
        };
        showSoundLabel(first.soundLabel, first.word, second.word);
        powerBrain();
        updateFoundPairs(first.soundLabel, first.word, second.word);
        updateStatus();
        publishProgress();
        selectedCards = [];
        if (activeRound.foundSoundIds.size === activeRound.targetPairCount) {
          finishRound();
        }
      } else {
        buttons.forEach(button => button.classList.add("wrong"));
        hideFeedback();
        setTimeout(() => {
          buttons.forEach(button => button.classList.remove("selected", "wrong"));
          selectedCards = [];
        }, 520);
      }
    }

    function showSoundLabel(label, firstWord, secondWord) {
      if (settings.showLabels) {
        if (feedbackTimer) {
          clearTimeout(feedbackTimer);
          feedbackTimer = null;
        }
        feedback.textContent = label;
        feedback.classList.remove("celebrate");
        feedback.classList.add("show");
        void feedback.offsetWidth;
        feedback.classList.add("celebrate");
        feedbackTimer = setTimeout(hideFeedback, 1450);
      } else {
        hideFeedback();
      }
    }

    function hideFeedback() {
      if (feedbackTimer) {
        clearTimeout(feedbackTimer);
        feedbackTimer = null;
      }
      feedback.classList.remove("show");
      feedback.classList.remove("celebrate");
      feedback.textContent = "";
    }

    function powerBrain() {
      brain.classList.add("boost");
      setTimeout(() => brain.classList.remove("boost"), 330);
    }

    function updateFoundPairs(label, firstWord, secondWord) {
      if (!settings.showLabels) return;

      const chip = document.createElement("div");
      chip.className = "pair-chip";
      chip.textContent = `${firstWord} + ${secondWord}: ${label}`;
      foundPairs.appendChild(chip);
    }

    function finishRound() {
      activeRound.finished = true;
      const oddCard = activeRound.cards.find(card => card.odd);
      const oddButton = wordGrid.querySelector(`[data-id="${CSS.escape(oddCard.id)}"]`);
      if (oddButton) {
        oddButton.classList.add("matched");
        oddButton.disabled = true;
      }
      oddCard.matched = true;
      publishProgress();

      if (settings.showLabels) {
        const oddChip = document.createElement("div");
        oddChip.className = "odd-chip";
        oddChip.textContent = `${oddCard.word} is the odd word`;
        foundPairs.appendChild(oddChip);
      }

      if (roundNumber >= settings.totalRounds) {
        setTimeout(completeGame, 680);
      } else {
        setTimeout(fadeToNextRound, 900);
      }
    }

    function fadeToNextRound() {
      wordGrid.classList.add("fading-out");
      setTimeout(() => {
        nextRound();
        wordGrid.classList.remove("fading-out");
      }, 460);
    }

    function nextRound() {
      if (!selectedSounds.length) return;
      if (roundNumber >= settings.totalRounds) {
        completeGame();
        return;
      }
      roundNumber += 1;
      buildRound();
      hideFeedback();
      renderRound();
    }

    function startGame() {
      if (!readSettings()) {
        feedback.textContent = "Choose at least one sound family.";
        feedback.classList.add("show");
        return;
      }

      stopTimer();
      app.classList.add("playing");
      completion.classList.remove("show");
      roundNumber = 0;
      scorePairs = 0;
      selectedCards = [];
      usedTargetWords = new Set();
      usedPatternCounts = new Map();
      latestMatch = null;
      currentMatchKey = "";
      resetSoundQueue();
      updatePowerVisuals(0);
      timer.hidden = !settings.timerEnabled;
      if (settings.timerEnabled) {
        startTimer();
      }
      if (liveMode && liveRole === "player" && roomRef) {
        roomRef.update({
          state: "playing",
          "player/status": "playing",
          updatedAt: firebase.database.ServerValue.TIMESTAMP
        });
      }
      nextRound();
    }

    function showPlayerReady(message = "Press ready to start.", readyDisabled = false) {
      pendingPlayerStart = true;
      app.classList.add("playing", "player-mode");
      completion.classList.remove("show");
      readyOverlay.classList.add("show");
      countdownOverlay.classList.remove("show");
      readyOverlay.querySelector("p").textContent = message;
      readyBtn.disabled = readyDisabled;
      clearWordCards();
      foundPairs.innerHTML = "";
      roundLine.textContent = "Ready";
      powerFill.style.width = "0%";
      updatePowerVisuals(0);
    }

    function startPlayerCountdown() {
      if (!pendingPlayerStart) return;

      pendingPlayerStart = false;
      readyBtn.disabled = false;
      readyOverlay.classList.remove("show");
      countdownOverlay.classList.add("show");

      const steps = ["3", "2", "1", "Go"];
      let index = 0;
      countdownNumber.textContent = steps[index];
      countdownNumber.style.animation = "none";
      void countdownNumber.offsetWidth;
      countdownNumber.style.animation = "";

      const countdownId = setInterval(() => {
        index += 1;
        if (index >= steps.length) {
          clearInterval(countdownId);
          countdownOverlay.classList.remove("show");
          startGame();
          return;
        }

        countdownNumber.textContent = steps[index];
        countdownNumber.style.animation = "none";
        void countdownNumber.offsetWidth;
        countdownNumber.style.animation = "";
      }, 800);
    }

    async function handleReadyClick() {
      if (liveMode && liveRole === "player" && roomRef) {
        readyBtn.disabled = true;
        await roomRef.update({
          "player/ready": true,
          "player/status": "ready",
          updatedAt: firebase.database.ServerValue.TIMESTAMP
        });
        readyOverlay.querySelector("p").textContent = "Ready. Waiting for teacher.";
        return;
      }

      startPlayerCountdown();
    }

    async function publishProgress(status = "playing") {
      if (!liveMode || liveRole !== "player" || !roomRef) return;

      const cards = activeRound?.cards?.map(card => ({
        id: card.id,
        word: card.word,
        soundLabel: card.soundLabel,
        odd: Boolean(card.odd),
        matched: Boolean(card.matched),
        view: card.view || null
      })) || [];

      await roomRef.update({
        "player/status": status,
        "progress/round": roundNumber,
        "progress/pairsFound": scorePairs,
        "progress/totalPairs": getTargetPairTotal(),
        "progress/finished": status === "finished",
        "progress/cards": cards,
        "progress/lastMatch": latestMatch,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
    }

    function openTeacherControls() {
      stopTimer();
      playerMode = false;
      app.classList.remove("playing", "player-mode");
      app.classList.remove("teacher-live-mode", "live-player-mode");
      app.classList.add("setup-visible");
      completion.classList.remove("show");
      shareBox.classList.remove("show");
      laserActive = false;
      laserBtn.classList.remove("active");
      wordGrid.classList.remove("laser-armed");
      window.history.replaceState(null, "", window.location.pathname);
    }

    function startTimer() {
      remainingSeconds = settings.timerSeconds;
      updateTimer();
      timerId = setInterval(() => {
        remainingSeconds -= 1;
        updateTimer();
        if (remainingSeconds <= 0) {
          stopTimer();
          completeGame(true);
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function updateTimer() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = String(remainingSeconds % 60).padStart(2, "0");
      timer.textContent = `${minutes}:${seconds}`;
    }

    function completeGame(timeUp = false) {
      stopTimer();
      activeRound = null;
      const targetPairs = getTargetPairTotal();
      const percent = Math.min(100, Math.round((scorePairs / targetPairs) * 100));
      powerFill.style.width = `${percent}%`;
      updatePowerVisuals(percent);
      completionText.textContent = timeUp
        ? `Time is up. You powered the brain with ${scorePairs} sound pairs.`
        : `You powered the brain with ${scorePairs} sound pairs.`;
      if (liveMode && liveRole === "player") {
        publishProgress("finished");
        roomRef.update({
          state: "finished",
          "player/status": "finished",
          updatedAt: firebase.database.ServerValue.TIMESTAMP
        });
        showPlayerReady("Finished. Waiting for teacher.", true);
      } else {
        completion.classList.add("show");
      }
    }

    renderSoundOptions();
    timerToggle.addEventListener("change", () => {
      timerInput.disabled = !timerToggle.checked;
    });
    startBtn.addEventListener("click", startGame);
    shareBtn.addEventListener("click", createPlayerLink);
    liveRoomBtn.addEventListener("click", createLiveRoom);
    liveStartBtn.addEventListener("click", startLiveRoom);
    liveResetBtn.addEventListener("click", resetLiveRoom);
    laserBtn.addEventListener("click", toggleLaserMode);
    wordGrid.addEventListener("click", sendLaserPoint);
    settingsBtn.addEventListener("click", openTeacherControls);
    playAgainBtn.addEventListener("click", startGame);
    readyBtn.addEventListener("click", handleReadyClick);
    completionSettingsBtn.addEventListener("click", openTeacherControls);
    const urlSettings = getSettingsFromUrl();
    if (urlSettings) {
      applySettingsToControls(urlSettings);
      playerMode = urlSettings.player;
      app.classList.toggle("player-mode", playerMode);
      if (urlSettings.room && playerMode) {
        joinLiveRoom(urlSettings.room);
      } else if (playerMode) {
        showPlayerReady();
      } else {
        app.classList.remove("setup-visible");
        startGame();
      }
    } else {
      app.classList.add("setup-visible");
    }
    updateStatus();
  </script>
</body>
</html>
